# 문서 검색용 Qdrant (README.md). .env 의 VECTOR_STORE=qdrant 일 때만 필요하다. 맥·서버 같은 파일을 쓴다.
# 먼저 .env 에 QDRANT_API_KEY 를 넣는다. 없으면 시작하지 않는다. 다른 컴퓨터에서 보려면 QDRANT_BIND 와 QDRANT_URL 에 이 컴퓨터의 내부 IP 를 넣는다
# 실행 (assistant/ 폴더에서): docker compose --env-file .env -f deploy/qdrant/docker-compose.yml up -d
# 멈춤: docker compose --env-file .env -f deploy/qdrant/docker-compose.yml down   (색인 데이터는 storage/ 에 남는다)
# 확인: curl -s -H "api-key: 키" http://주소:6333/collections   (다른 Qdrant 가 6333 을 쓰고 있으면 그쪽을 먼저 멈춘다)
# 화면: http://주소:6333/dashboard (들어가서 API 키를 넣는다)
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0  # qdrant-client 1.20 과 맞춘다. 올릴 때는 클라이언트도 같이
    container_name: assistant-qdrant  # 다른 프로젝트의 qdrant 컨테이너와 이름이 겹치지 않게
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND:-127.0.0.1}:6333:6333"  # 기본은 이 컴퓨터 안에서만. 공유기 포트포워딩은 하지 않는다
    volumes:
      - ./storage:/qdrant/storage  # 색인 데이터 (커밋하지 않음)
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?.env 에 QDRANT_API_KEY 를 넣어 주세요}  # 키 없이 뜨지 않게 한다
